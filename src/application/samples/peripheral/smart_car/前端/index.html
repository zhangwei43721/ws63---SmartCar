<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>智能小车UDP控制台</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <!-- 顶部导航 -->
  <header>
    <div class="brand">
      <div class="logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2" />
          <circle cx="7" cy="17" r="2" />
          <circle cx="17" cy="17" r="2" />
        </svg>
      </div>
      <div class="title">
        SmartCar <span class="badge">UDP</span>
      </div>
    </div>
    <div class="header-right">
      <div class="status-wrap">
        <div class="status-indicator" id="statusConn" title="连接状态"></div>
        <span class="status-text" id="statusText">离线</span>
      </div>
      <div class="btn-icon" onclick="toggleConfig()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
      </div>
    </div>
  </header>

  <!-- 主舞台区域 -->
  <main id="stage">
    <div class="car-wrapper">
      <!-- 车辆模型容器 -->
      <div class="car-model">
        <!-- 1. 超声波传感器 -->
        <div class="ultrasonic-sensor">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <!-- 雷达扫描波束 -->
          <div class="radar-beam" id="radarBeam"></div>
        </div>

        <!-- 2. 动力轮 -->
        <div class="wheel left" id="wheelL">
          <div class="tire-tread"></div>
        </div>
        <div class="wheel right" id="wheelR">
          <div class="tire-tread"></div>
        </div>

        <!-- 3. 车身主体 -->
        <div class="chassis">
          <!-- 装饰性芯片图案 -->
          <div class="mcu-deco">HI3863</div>

          <!-- 循迹传感器模块 -->
          <div class="sensor-bar">
            <div class="ir-led" id="irL"></div>
            <div class="ir-led" id="irM"></div>
            <div class="ir-led" id="irR"></div>
          </div>

          <!-- 后万向轮 -->
          <div class="caster-wheel"></div>
        </div>
      </div>

      <!-- 实时数据悬浮窗 -->
      <div class="dashboard-stats">
        <div class="stat-item">
          <span class="label">距离</span>
          <span class="value" id="statusDist">--</span>
          <span class="unit">cm</span>
        </div>
      </div>
    </div>
  </main>

  <!-- 底部控制面板 -->
  <section id="controls">
    <!-- 模式切换栏 -->
    <div class="mode-switcher">
      <button class="mode-btn active" onclick="changeMode('standby')">待机</button>
      <button class="mode-btn" onclick="changeMode('remote')">遥控</button>
      <button class="mode-btn" onclick="changeMode('tracking')">循迹</button>
      <button class="mode-btn" onclick="changeMode('avoid')">避障</button>
    </div>

    <!-- PID 调试面板 (仅在循迹模式显示) -->
    <div id="pidPanel"
      style="display: none; background: #f8f6f6; padding: 15px; margin-bottom: 15px; border-radius: 8px;">
      <h4 style="margin: 0 0 10px 0; color: #000000;">PID 参数调试</h4>
      <div class="form-group">
        <label style="color: #000000;">Kp</label>
        <div style="display: flex; gap: 10px; align-items: center;">
          <input type="range" id="pidKp" min="0" max="100" step="0.5" value="25"
            oninput="updatePidVal('pidKpVal', this.value)" style="flex: 1;">
          <span id="pidKpVal" style="width: 30px; text-align: right; color: #000000;">25</span>
          <button class="btn-sm" onclick="sendPid(1)">SET</button>
        </div>
      </div>
      <div class="form-group">
        <label style="color: #000000;">Ki</label>
        <div style="display: flex; gap: 10px; align-items: center;">
          <input type="range" id="pidKi" min="0" max="50" step="0.1" value="0"
            oninput="updatePidVal('pidKiVal', this.value)" style="flex: 1;">
          <span id="pidKiVal" style="width: 30px; text-align: right; color: #000000;">0</span>
          <button class="btn-sm" onclick="sendPid(2)">SET</button>
        </div>
      </div>
      <div class="form-group">
        <label style="color: #000000;">Kd</label>
        <div style="display: flex; gap: 10px; align-items: center;">
          <input type="range" id="pidKd" min="0" max="100" step="0.5" value="10"
            oninput="updatePidVal('pidKdVal', this.value)" style="flex: 1;">
          <span id="pidKdVal" style="width: 30px; text-align: right; color: #000000;">10</span>
          <button class="btn-sm" onclick="sendPid(3)">SET</button>
        </div>
      </div>
      <div class="form-group">
        <label style="color: #000000;">速度</label>
        <div style="display: flex; gap: 10px; align-items: center;">
          <input type="range" id="pidSpeed" min="10" max="80" step="5" value="40"
            oninput="updatePidVal('pidSpeedVal', this.value)" style="flex: 1;">
          <span id="pidSpeedVal" style="width: 30px; text-align: right; color: #000000;">40</span>
          <button class="btn-sm" onclick="sendPid(4)">SET</button>
        </div>
      </div>
      <div class="form-group" style="margin-top: 10px;">
        <button class="btn-sm" onclick="savePid()"
          style="width: 100%; background: #34c759; color: #fff; border: none; padding: 8px; border-radius: 6px; cursor: pointer;">保存
          PID 到小车</button>
      </div>
    </div>

    <div class="dpad disabled" id="dpad">
      <button class="dpad-btn up" id="btnForward">前进</button>
      <button class="dpad-btn left" id="btnLeft">左转</button>
      <button class="dpad-btn stop" id="btnStop">停止</button>
      <button class="dpad-btn right" id="btnRight">右转</button>
      <button class="dpad-btn down" id="btnBackward">后退</button>
    </div>

  </section>

  <!-- 设置弹窗 -->
  <div class="modal-backdrop" id="configModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>设置</h3>
        <span class="close-btn" onclick="toggleConfig()">×</span>
      </div>

      <!-- 标签页导航 -->
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('connect')" data-tab="connect">连接小车</button>
        <button class="tab-btn" onclick="switchTab('config')" data-tab="config">小车配置</button>
      </div>

      <div class="modal-body">
        <!-- 第一页：连接小车 -->
        <div class="tab-page active" id="tab-connect">
          <div class="form-section">
            <div class="form-group">
              <label>状态</label>
              <div id="discoveryStatus" class="status-box">正在搜索设备...</div>
            </div>
          </div>

          <div class="form-section">
            <h4>发现的小车</h4>
            <div id="deviceList" class="device-list">
              <div class="device-empty">等待设备发现...</div>
            </div>
          </div>
        </div>

        <!-- 第二页：小车配置 -->
        <div class="tab-page" id="tab-config" style="display: none;">
          <!-- WiFi 配置 -->
          <div class="form-section">
            <h4>WiFi 配置</h4>
            <div class="form-group">
              <label>网络名称 (SSID)</label>
              <input type="text" id="wifiSSID" placeholder="输入WiFi名称" maxlength="32" />
            </div>
            <div class="form-group">
              <label>密码</label>
              <input type="password" id="wifiPassword" placeholder="输入WiFi密码" maxlength="64" />
            </div>
            <div class="button-group">
              <button class="btn-secondary" onclick="saveWifiConfig()">保存配置</button>
              <button class="btn-primary" onclick="connectWifi()">保存并连接</button>
            </div>
          </div>

          <!-- OTA 固件升级 -->
          <div class="form-section ota-section">
            <h4>固件升级</h4>
            <div class="ota-row">
              <input type="file" id="otaFile" accept=".fwpkg,.bin,.pkg" onchange="onOtaFileSelected(this)" />
              <label for="otaFile" class="ota-file-btn" id="otaFileLabel">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                  <polyline points="17 8 12 3 7 8" />
                  <line x1="12" y1="3" x2="12" y2="15" />
                </svg>
                选择文件
              </label>
              <span class="ota-filename" id="otaFileName">未选择文件</span>
              <button class="ota-btn" id="otaStartBtn" onclick="startOta()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <polyline points="22 12 16 12 14 15 10 15 8 12 2 12" />
                  <path
                    d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" />
                </svg>
                开始升级
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- OTA 进度弹窗 -->
  <div class="modal-backdrop" id="otaModal">
    <div class="modal-card ota-modal">
      <div class="modal-header">
        <h3>OTA 固件升级</h3>
        <span class="close-btn" onclick="cancelOta()">×</span>
      </div>
      <div class="modal-body">
        <div class="ota-progress">
          <div class="ota-progress-bar" id="otaProgressBar"></div>
        </div>
        <div style="margin-top: 10px; display: flex; justify-content: space-between; align-items: center;">
          <span id="otaStatusText">准备中...</span>
          <span class="ota-meta" id="otaMeta">等待中 · 0%</span>
        </div>
        <div class="ota-hint" style="margin-top: 12px;">
          升级过程中请勿关闭页面或断开小车电源。
        </div>
        <div style="margin-top: 16px; text-align: right;">
          <button class="btn-secondary" onclick="cancelOta()" id="otaCancelBtn">取消</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>

</html>
