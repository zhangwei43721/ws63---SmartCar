<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>小车WiFi配网</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Google Sans', Roboto, -apple-system, BlinkMacSystemFont, sans-serif; background: #f0f4f9; color: #1f1f1f; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
        .card { background: #ffffff; border-radius: 28px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); padding: 24px; width: 100%; max-width: 360px; border: 1px solid #e1e3e1; }
        h1 { font-size: 22px; color: #1f1f1f; margin-bottom: 4px; text-align: center; font-weight: 500; }
        .sub { color: #747775; font-size: 13px; text-align: center; margin-bottom: 20px; }
        .field { margin-bottom: 16px; }
        label { display: block; font-size: 13px; color: #444746; margin-bottom: 6px; font-weight: 500; }
        input, select { width: 100%; padding: 12px 14px; border: 1px solid #e1e3e1; border-radius: 12px; font-size: 15px; outline: 0; background: #ffffff; color: #1f1f1f; transition: border .2s; }
        input:focus, select:focus { border-color: #0b57d0; }
        select { margin-top: 8px; }
        .btn-primary { width: 100%; padding: 13px; border: 0; border-radius: 12px; background: #0b57d0; color: #ffffff; font-size: 16px; font-weight: 500; cursor: pointer; margin-top: 4px; }
        .btn-primary:active { opacity: .9; }
        .btn-secondary { margin-top: 8px; background: #f0f4f9; color: #444746; font-size: 13px; padding: 8px 14px; border: 0; border-radius: 12px; cursor: pointer; }
        .scan-tip { font-size: 12px; color: #747775; margin-top: 6px; }
        .ctrl-box { margin-top: 18px; text-align: center; }
        .ctrl-link { display: inline-block; padding: 10px 20px; background: #c2e7ff; color: #001d35; text-decoration: none; border-radius: 12px; font-size: 15px; font-weight: 500; }
        .ctrl-sub { margin-top: 8px; font-size: 12px; color: #747775; }
        .tip { margin-top: 14px; font-size: 12px; color: #747775; text-align: center; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <h1>智能小车配网</h1>
        <p class="sub">连接你的WiFi，让小车接入局域网</p>
        <form method="POST" action="/config">
            <div class="field">
                <label>WiFi 名称 (SSID)</label>
                <input type="text" id="ssid" name="ssid" placeholder="请输入WiFi名称" required maxlength="31">
                <select id="ssid_sel" onchange="pickSsid()">
                    <option value="">-- 附近 WiFi --</option>
                </select>
                <button type="button" class="btn-secondary" onclick="scanWifi(true)">刷新 WiFi 列表</button>
                <p id="scan_tip" class="scan-tip">正在加载附近 WiFi...</p>
            </div>
            <div class="field">
                <label>WiFi 密码</label>
                <input type="password" name="password" placeholder="请输入WiFi密码" maxlength="63">
            </div>
            <button type="submit" class="btn-primary">保存并连接</button>
        </form>
        <div class="ctrl-box">
            <a href="/control" class="ctrl-link">点击控制小车</a>
            <p class="ctrl-sub">无需配网也可直接遥控</p>
        </div>
        <p class="tip">提示：密码为空表示连接开放网络<br>配网成功后页面将自动跳转</p>
    </div>
    <script>
        function pickSsid() {
            var s = document.getElementById('ssid_sel');
            if (s.value) { document.getElementById('ssid').value = s.value; }
        }
        function scanWifi(refresh) {
            var t = document.getElementById('scan_tip');
            t.textContent = refresh ? '刷新中，请等待...' : '加载中...';
            var x = new XMLHttpRequest();
            x.open('GET', refresh ? '/scan?refresh=1' : '/scan', true);
            x.timeout = 8000;
            x.onreadystatechange = function () {
                if (x.readyState == 4) {
                    if (x.status == 200) {
                        try {
                            var d = JSON.parse(x.responseText);
                            var s = document.getElementById('ssid_sel');
                            s.innerHTML = '<option value="">-- 选择 SSID --</option>';
                            d.list.forEach(function (it) {
                                var o = document.createElement('option');
                                o.value = it.ssid;
                                o.textContent = it.ssid + ' (' + it.rssi + 'dBm' + (it.sec > 0 ? ' 加密' : ' 开放') + ')';
                                s.appendChild(o);
                            });
                            t.textContent = '共发现 ' + d.list.length + ' 个网络';
                        } catch (e) { t.textContent = '解析失败'; }
                    } else { t.textContent = '加载失败'; }
                }
            };
            x.ontimeout = function () { t.textContent = '加载超时'; };
            x.send();
        }
        window.onload = function () {
            scanWifi(false);
            if (location.search.includes('fail')) {
                document.body.insertAdjacentHTML('afterbegin', '<div style="position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#ffdad6;color:#ba1a1a;padding:12px 16px;border-radius:12px;font-size:14px;text-align:center;width:calc(100% - 32px);max-width:360px;z-index:10">连接失败，请检查密码后重新配网</div>');
            }
        };
    </script>
</body>
</html>
