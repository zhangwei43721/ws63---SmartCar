<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>连接失败</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Google Sans', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f0f4f9;
            color: #1f1f1f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            padding: 28px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            border: 1px solid #e1e3e1;
        }

        .err {
            background: #ffdad6;
            color: #ba1a1a;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 16px;
        }

        a {
            display: inline-block;
            margin-top: 12px;
            padding: 10px 24px;
            background: #0b57d0;
            color: #ffffff;
            text-decoration: none;
            border-radius: 12px;
            font-size: 15px;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="err">连接失败，请检查密码后重新配网</div>
        <a href="/">返回配网页面</a>
    </div>
</body>

</html>
